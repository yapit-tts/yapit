volumes:
  pgdata:
  metricsdata:

networks:
  browser-net:
    driver: bridge
  worker-net:
    driver: bridge

services:
  # -------- database
  postgres:
    init: true
    image: postgres:16-alpine
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID, KILL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-yapit}"]
      start_period: 30s
      start_interval: 1s
      interval: 30s
      timeout: 3s
      retries: 10

  # -------- metrics (separate from main postgres for isolation)
  metrics-db:
    profiles: ["metrics"]
    init: true
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID, KILL]
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_USER: metrics
      POSTGRES_PASSWORD: metrics
      POSTGRES_DB: metrics
    volumes:
      - metricsdata:/var/lib/postgresql/data
      - ./docker/metrics-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metrics"]
      start_period: 30s
      start_interval: 1s
      interval: 30s
      timeout: 3s
      retries: 10

  # -------- cache / queue
  redis:
    init: true
    # Pinned to match prod (see docker-compose.prod.yml). No volume here on purpose:
    # dev wants a clean slate per run. Prod and selfhost add persistence in their overlays.
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    user: redis
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks:
      - default
      - worker-net

  smokescreen:
    init: true
    build:
      dockerfile: ./docker/Dockerfile.smokescreen
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks:
      - default
      - browser-net

  # -------- content extraction (isolated: no credentials, no access to internal services)
  defuddle:
    init: true
    build:
      context: .
      dockerfile: docker/defuddle/Dockerfile
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks:
      - browser-net
    environment:
      PROXY_URL: http://smokescreen:4750
    expose: ["8001"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8001/health').then(r => { if (!r.ok) process.exit(1) })"]
      start_period: 30s
      start_interval: 1s
      interval: 30s
      timeout: 5s
      retries: 10
    depends_on:
      smokescreen:
        condition: service_started
    restart: unless-stopped

  # -------- api-gateway
  gateway:
    init: true
    build:
      context: .
      dockerfile: yapit/gateway/Dockerfile
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      smokescreen:
        condition: service_started
      defuddle:
        condition: service_healthy
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks:
      - default
      - browser-net
      - worker-net
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      start_period: 80s
      start_interval: 1s
      interval: 30s
      timeout: 5s
      retries: 10

  # svix:
  #   image: svix/svix-server
  #   restart: unless-stopped
  #   env_file: ./.env.prod

  # -------- workers
  kokoro-cpu:
    init: true
    build:
      context: .
      dockerfile: yapit/workers/kokoro/Dockerfile.cpu
    command: uv run python -m yapit.workers.kokoro
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks:
      - worker-net
    environment:
      REDIS_URL: redis://redis:6379
      OMP_NUM_THREADS: ${OMP_NUM_THREADS}
    restart: unless-stopped
    deploy:
      replicas: ${KOKORO_CPU_REPLICAS}

  yolo-cpu:
    init: true
    build:
      context: .
      dockerfile: yapit/workers/yolo/Dockerfile.cpu
    command: uv run python -m yapit.workers.yolo
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks:
      - worker-net
    environment:
      REDIS_URL: redis://redis:6379
      OMP_NUM_THREADS: ${OMP_NUM_THREADS}
    restart: unless-stopped
    deploy:
      replicas: ${YOLO_CPU_REPLICAS}
