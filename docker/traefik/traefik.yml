global:
  sendAnonymousUsage: false

log:
  level: INFO

providers:
  swarm:
    endpoint: tcp://socket-proxy:2375
    exposedByDefault: false
    watch: true
    network: yapit-network
  file:
    directory: /etc/traefik/dynamic
    watch: true

entryPoints:
  web:
    address: :80
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: :443

api:
  insecure: false

accessLog:
  filePath: "/dev/stdout"
  format: json
  fields:
    headers:
      defaultMode: keep
