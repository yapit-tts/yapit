volumes:
  pgdata:
  redisdata:
  audio_cache:
  document_cache:
  extraction_cache:
  gateway-data:
  metricsdata:

networks:
  yapit-network:
    external: true
  browser-net:
    driver: overlay
  worker-net:
    driver: overlay

services:
  frontend:
    init: true
    image: ghcr.io/yapit-tts/frontend:latest
    cap_drop: [ALL]
    networks:
      - yapit-network
    deploy:
      replicas: 1
      update_config:
        order: start-first
        failure_action: rollback
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.yapit-frontend.rule=Host(`yapit.md`)"
        - "traefik.http.routers.yapit-frontend.entrypoints=websecure"
        - "traefik.http.routers.yapit-frontend.tls=true"
        - "traefik.http.services.yapit-frontend.loadbalancer.server.port=8080"

  postgres:
    init: true
    image: postgres:16-alpine
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID, KILL]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - yapit-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-yapit}"]
      start_period: 30s
      start_interval: 1s
      interval: 30s
      timeout: 3s
      retries: 10
    deploy:
      replicas: 1
      update_config:
        order: stop-first  # Stateful - stop old before starting new

  redis:
    init: true
    # Pinned: `docker stack deploy` resolves floating tags to a digest, so an upstream
    # :7-alpine push recreates this container on the next unrelated deploy, wiping
    # Redis. Bump deliberately.
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    # AOF so a container recreation doesn't drop unacked billing events. No per-write
    # fsync: this Redis also buffers audio blobs, and syncing those would stall synthesis.
    command: redis-server --appendonly yes --appendfsync no
    user: redis
    cap_drop: [ALL]
    volumes:
      - redisdata:/data
    ports:
      - target: 6379
        published: 6379
        protocol: tcp
        mode: host  # Bypass Swarm ingress; binds to 0.0.0.0 on this node only
    # Security: Swarm cannot bind to specific IPs. External access blocked by
    # Hetzner firewall + UFW. Tailscale workers connect via VPN (bypasses UFW).
    networks:
      - yapit-network
      - worker-net
    deploy:
      replicas: 1
      update_config:
        order: stop-first

  smokescreen:
    init: true
    image: ghcr.io/yapit-tts/smokescreen:latest
    cap_drop: [ALL]
    networks:
      - yapit-network
      - browser-net
    deploy:
      replicas: 1
      update_config:
        order: start-first
        failure_action: rollback

  defuddle:
    init: true
    image: ghcr.io/yapit-tts/defuddle:latest
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks:
      - browser-net
    environment:
      PROXY_URL: http://smokescreen:4750
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8001/health').then(r => { if (!r.ok) process.exit(1) })"]
      start_period: 30s
      start_interval: 1s
      interval: 30s
      timeout: 5s
      retries: 10
    deploy:
      replicas: 1
      update_config:
        order: start-first
        failure_action: rollback

  metrics-db:
    init: true
    image: timescale/timescaledb:latest-pg16
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID, KILL]
    environment:
      POSTGRES_USER: ${METRICS_DB_USER}
      POSTGRES_PASSWORD: ${METRICS_DB_PASSWORD}
      POSTGRES_DB: metrics
    volumes:
      - metricsdata:/var/lib/postgresql/data
      - ./docker/metrics-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - yapit-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${METRICS_DB_USER:-metrics}"]
      start_period: 30s
      start_interval: 1s
      interval: 30s
      timeout: 3s
      retries: 10
    deploy:
      replicas: 1
      update_config:
        order: stop-first

  gateway:
    init: true
    stop_grace_period: 3m
    image: ghcr.io/yapit-tts/gateway:latest
    cap_drop: [ALL]
    env_file:
      - ./.env
      - ./.env.prod
    volumes:
      - audio_cache:/data/audio_cache
      - document_cache:/data/document_cache
      - extraction_cache:/data/extraction_cache
      - gateway-data:/data/gateway
    networks:
      - yapit-network
      - browser-net
      - worker-net
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      start_period: 80s
      start_interval: 1s
      interval: 30s
      timeout: 5s
      retries: 10
    deploy:
      replicas: 1
      update_config:
        order: start-first
        failure_action: rollback

  kokoro-cpu:
    init: true
    image: ghcr.io/yapit-tts/kokoro-cpu:latest
    command: uv run python -m yapit.workers.kokoro
    cap_drop: [ALL]
    environment:
      REDIS_URL: redis://redis:6379
      WORKER_ID: swarm-kokoro-cpu-{{.Task.Slot}}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS}
    networks:
      - worker-net
    deploy:
      replicas: ${KOKORO_CPU_REPLICAS}
      update_config:
        order: start-first
        failure_action: rollback

  yolo-cpu:
    init: true
    image: ghcr.io/yapit-tts/yolo-cpu:latest
    command: uv run python -m yapit.workers.yolo
    cap_drop: [ALL]
    environment:
      REDIS_URL: redis://redis:6379
      WORKER_ID: swarm-yolo-cpu-{{.Task.Slot}}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS}
    networks:
      - worker-net
    deploy:
      replicas: ${YOLO_CPU_REPLICAS}
      update_config:
        order: start-first
        failure_action: rollback
