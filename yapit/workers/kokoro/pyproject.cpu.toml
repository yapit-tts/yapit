
[project]

name = "yapit-kokoro-cpu"
version = "0.1.0"
description = "Yapit Kokoro CPU worker"
requires-python = "~=3.12"
dependencies = [
  "pydantic~=2.12.5",
  "torch~=2.7.0",
  "kokoro~=0.9.4",
  # Japanese G2P: misaki[ja] would pull the wheel-less pyopenjtalk sdist and the full
  # unidic dictionary (manual 770MB download); these drop-ins avoid both.
  "misaki[zh]~=0.9.4",
  "pyopenjtalk-plus~=0.4.1",
  "fugashi~=1.5.1",
  "jaconv~=0.5.0",
  "mojimoji~=0.0.13",
  "unidic-lite~=1.0.8",
  "spacy~=3.8.4",
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
  "redis[hiredis]~=7.3.0",
  "loguru~=0.7.3",
  "av>=14.0.0",
]

[tool.uv.sources]

torch = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]

name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
