[project]
name = "yapit-yolo-cpu"
version = "0.1.0"
description = "Yapit YOLO figure detection CPU worker"
requires-python = "~=3.12"
dependencies = [
  "pydantic~=2.12.5",
  "torch~=2.7.0",
  "torchvision~=0.22.0",
  "doclayout-yolo~=0.0.4",
  "huggingface-hub~=0.32.4",
  "pillow~=13.0",
  "redis[hiredis]~=7.3.0",
  "loguru~=0.7.3",
  "PyMuPDF~=1.28.2",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv]
# The image is built only for these, and uv skips any release without a wheel for each of them.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'", "sys_platform == 'linux' and platform_machine == 'aarch64'"]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'", "sys_platform == 'linux' and platform_machine == 'aarch64'"]
