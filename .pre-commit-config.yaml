repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      # lint (check-only to avoid stash conflicts with unstaged changes)
      - id: ruff
        types_or: [ python, pyi ]
        language: python
        args: [ --no-fix ]
      # format (check-only)
      - id: ruff-format
        types_or: [ python, pyi ]
        args: [ --check ]

  - repo: local
    hooks:
      - id: ty-check
        name: ty type check
        # pinned: ty@latest broke on new false positives with zero code changes; bump deliberately (keep in sync with Makefile check-backend)
        entry: uvx ty@0.0.56 check yapit/
        language: system
        files: ^yapit/
        types_or: [python]
        pass_filenames: false
      - id: frontend-build
        name: frontend build
        entry: bash -c 'cd frontend && npm run build'
        language: system
        files: ^frontend/
        types_or: [ts, tsx]
        pass_filenames: false
